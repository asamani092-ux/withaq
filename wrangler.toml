name = "withaq"
main = "worker/src/index.ts"
compatibility_date = "2026-05-01"

[assets]
directory = "web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "withaq"
database_id = "06a2f9e9-09d2-4396-a927-b08826609f70"   # wrangler d1 create withaq

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "withaq-files"            # wrangler r2 bucket create withaq-files

[vars]
SESSION_DAYS = "30"

